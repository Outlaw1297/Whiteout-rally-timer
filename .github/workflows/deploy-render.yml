name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Triggered Render deploy via deploy hook."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -d '{"clearCache": false}'
            echo "Triggered Render deploy via API."
          else
            echo "No Render deploy secrets configured."
            echo "Add RENDER_DEPLOY_HOOK or RENDER_API_KEY + RENDER_SERVICE_ID in repo secrets to enable deploy automation."
          fi
